[package]
name = "sculptary-cli"
version = "0.4.0"
edition = "2021"
description = "Command line for Sculptary: version control and collaboration for 3D"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sculptary/cli"
readme = "README.md"
keywords = ["3d", "git", "lfs", "gltf", "sculptary"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "blocking"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.0"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "shape"
path = "src/main.rs"
