name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: sculpt }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: sculpt }
          - { os: macos-latest, target: x86_64-apple-darwin, bin: sculpt }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: sculpt.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../sculpt-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ matrix.bin }}
      - uses: softprops/action-gh-release@v2
        with:
          files: sculpt-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
