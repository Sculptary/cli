name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - id: release
        shell: bash
        run: |
          tag=$(python scripts/release.py tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bin: sculpt }
          - { os: macos-15, target: aarch64-apple-darwin, bin: sculpt }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bin: sculpt }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: sculpt.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.bin }}
        run: |
          python scripts/release.py archive --tag "$RELEASE_TAG" --target "$TARGET" --binary "target/$TARGET/release/$BINARY" --output release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error
  assemble:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python scripts/release.py generate --tag "$RELEASE_TAG" --artifacts release --output release
      - run: python scripts/release.py verify release
      - uses: actions/upload-artifact@v4
        with:
          name: sculpt-release-bundle
          path: release/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.validate.outputs.tag, '-') }}
